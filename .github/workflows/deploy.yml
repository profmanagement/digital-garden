name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: sudo apt-get install -y pandoc

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build site
        run: |
          mkdir -p _site/en _site/de
          cp style.css _site/style.css
          [ -d images ] && cp -r images _site/images
          cp sidenotes.js _site/sidenotes.js
          cp graph-init.js _site/en/graph-init.js
          cp graph-init.js _site/de/graph-init.js

          # ── Helpers ────────────────────────────────────────────────────────

          # Preprocess wikilinks before Pandoc:
          # [[target|label]] → [label](target.html)
          # [[target]]       → [target](target.html)
          preprocess() {
            sed -E \
              -e 's/!\[\[([^\]]+)\]\]/![\1](..\/images\/\1)/g' \
              -e 's/\[\[([^|\]]+)\|([^\]]+)\]\]/[\2](\1.html)/g' \
              -e 's/\[\[([^\]]+)\]\]/[\1](\1.html)/g' \
              "$1"
          }

          # Extract a YAML frontmatter field (handles quoted & unquoted values)
          get_field() {
            grep -m1 "^$2:" "$1" | sed "s/^$2:[[:space:]]*//" | tr -d '"' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }

          get_title() { get_field "$1" "title"; }

          # ── Root redirect ─────────────────────────────────────────────────
          {
            echo '<!DOCTYPE html>'
            echo '<html lang="en"><head><meta charset="utf-8">'
            echo '<meta http-equiv="refresh" content="0;url=en/">'
            echo '<title>🪴 Digital Garden</title>'
            echo '</head><body><a href="en/">🪴 Digital Garden</a></body></html>'
          } > _site/index.html

          # ── Generate notes listing fragments ──────────────────────────────
          # Builds _notes_listing_{lang}.html with note cards.
          # Each card shows: type badge, category, title (linked),
          # description, author, tags. Sorted newest-first by `created`.
          build_notes_listing() {
            local lang="$1"
            local dir="content/${lang}/notes"
            local out="_notes_listing_${lang}.html"
            local by_label
            [ "$lang" = "en" ] && by_label="By" || by_label="Von"
            {
              echo '<section class="notes-list">'
              while IFS= read -r f; do
                [ -f "$f" ] || continue
                local slug title type category description author written_by tags created
                slug=$(basename "${f%.md}")
                title=$(get_field "$f" "title")
                type=$(get_field "$f" "type")
                category=$(get_field "$f" "category")
                description=$(get_field "$f" "description")
                author=$(get_field "$f" "author")
                written_by=$(get_field "$f" "written_by")
                tags=$(get_field "$f" "tags")
                created=$(get_field "$f" "created")

                echo "<a href=\"${slug}.html\" class=\"note-summary\">"
                echo "  <div class=\"note-summary-title\">${title}</div>"

                # Meta line: Category | Description
                local meta=""
                [ -n "$category" ] && meta="${category}"
                [ -n "$description" ] && meta="${meta:+${meta} | }${description}"
                [ -n "$meta" ] && echo "  <div class=\"note-summary-meta\">${meta}</div>"

                # Author line: {type} By {author} ({written_by})
                echo '  <div class="note-summary-author">'
                [ -n "$type" ] && echo "    <span class=\"note-type note-type--${type}\">${type}</span>"
                [ -n "$author" ] && echo -n "    ${by_label} ${author}"
                [ -n "$written_by" ] && echo " (${written_by})" || echo ""
                echo '  </div>'

                # Footer line: Created - Tags
                local footer=""
                [ -n "$created" ] && footer="${created}"
                [ -n "$tags" ] && footer="${footer:+${footer} - }${tags}"
                [ -n "$footer" ] && echo "  <div class=\"note-summary-footer\">${footer}</div>"

                echo '</a>'
              done < <(
                for n in "$dir"/*.md; do
                  [ -f "$n" ] || continue
                  c=$(get_field "$n" "created")
                  echo "${c:-0000-00-00} $n"
                done | sort -rk1 | sed 's/^[^ ]* //'
              )
              echo '</section>'
            } > "$out"
          }

          build_notes_listing en
          build_notes_listing de

          # ── English homepage → _site/en/index.html ────────────────────────
          # NOTE: use echo statements, never heredocs inside run: | blocks.
          # See _comms/06_TROUBLESHOOTING/ for the reason.
          {
            echo '<nav class="site-nav">'
            echo '  <a class="nav-logo" href="index.html">🪴 Digital Garden</a>'
            echo '  <span class="nav-links">'
            echo '    <a href="index.html">HOME</a>'
            echo '    <span class="nav-sep">|</span>'
            echo '    <a href="about.html">ABOUT</a>'
            echo '  </span>'
            echo '  <span class="nav-right">'
            echo '    <span class="nav-lang"><a href="index.html">EN</a> &middot; <a href="../de/index.html">DE</a></span>'
            echo '    <a class="nav-search" href="search.html">&#x1F50D;</a>'
            echo '  </span>'
            echo '</nav>'
          } > _nav_en_index.html

          # Create shared graph footer (used on all pages)
          {
            echo '<div id="graph-modal" class="graph-modal"><div class="graph-container"><div id="graph-network"></div><div class="graph-legend"><p><span class="legend-dot legend-seedling">●</span> Seedling</p><p><span class="legend-dot legend-growing">●</span> Growing</p><p><span class="legend-dot legend-evergreen">●</span> Evergreen</p></div><button id="graph-close" class="graph-close" title="Close graph">✕</button></div></div>'
            echo '<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>'
            echo '<script src="graph-init.js"></script>'
          } > _graph_footer.html

          pt=$(get_title "content/en/en/index.md")
          preprocess "content/en/en/index.md" | pandoc \
            --standalone \
            --css ../style.css \
            --metadata pagetitle="$pt" \
            --metadata title="" \
            --include-before-body _nav_en_index.html \
            --include-after-body _graph_footer.html \
            --lua-filter .pandoc/wikilinks.lua \
            -o _site/en/index.html

          # Inject feed discovery link into <head>
          sed -i '/<\/head>/i\  <link rel="alternate" type="application/rss+xml" title="RSS Feed" href="feed.xml">' _site/en/index.html

          # Inject graph button inside <span class="nav-right"> (after opening tag)
          sed -i '/<span class="nav-right">/a\    <button id="graph-btn" class="graph-btn" title="Show knowledge graph">📊 Graph</button>' _site/en/index.html

          # Inject notes listing right after <h2 id="notes"> (awk one-liner)
          awk '/<h2 id="notes">/{print; while((getline line < "_notes_listing_en.html") > 0) print line; close("_notes_listing_en.html"); next}1' \
            _site/en/index.html > _tmp.html && mv _tmp.html _site/en/index.html

          # Inject RSS footer at end of body
          sed -i '/<\/body>/i\  <footer class="site-footer"><a href="feed.xml" class="footer-rss" title="Subscribe to RSS feed">📡 RSS</a></footer>' _site/en/index.html

          # ── German homepage → _site/de/index.html ──────────────────────────
          {
            echo '<nav class="site-nav">'
            echo '  <a class="nav-logo" href="index.html">🪴 Digital Garden</a>'
            echo '  <span class="nav-links">'
            echo '    <a href="index.html">HOME</a>'
            echo '    <span class="nav-sep">|</span>'
            echo '    <a href="about.html">ÜBER MICH</a>'
            echo '  </span>'
            echo '  <span class="nav-right">'
            echo '    <span class="nav-lang"><a href="../en/index.html">EN</a> &middot; <a href="index.html">DE</a></span>'
            echo '    <a class="nav-search" href="search.html">&#x1F50D;</a>'
            echo '  </span>'
            echo '</nav>'
          } > _nav_de_index.html

          pt=$(get_title "content/de/de/index.md")
          preprocess "content/de/de/index.md" | pandoc \
            --standalone \
            --css ../style.css \
            --metadata pagetitle="$pt" \
            --metadata title="" \
            --include-before-body _nav_de_index.html \
            --include-after-body _graph_footer.html \
            --lua-filter .pandoc/wikilinks.lua \
            -o _site/de/index.html

          # Inject feed discovery link into <head>
          sed -i '/<\/head>/i\  <link rel="alternate" type="application/rss+xml" title="RSS Feed" href="feed.xml">' _site/de/index.html

          # Inject graph button inside <span class="nav-right"> (after opening tag)
          sed -i '/<span class="nav-right">/a\    <button id="graph-btn" class="graph-btn" title="Wissensgraph anzeigen">📊 Graph</button>' _site/de/index.html

          # Inject notes listing right after <h2 id="notizen"> (awk one-liner)
          awk '/<h2 id="notizen">/{print; while((getline line < "_notes_listing_de.html") > 0) print line; close("_notes_listing_de.html"); next}1' \
            _site/de/index.html > _tmp.html && mv _tmp.html _site/de/index.html

          # Inject RSS footer at end of body
          sed -i '/<\/body>/i\  <footer class="site-footer"><a href="feed.xml" class="footer-rss" title="RSS Feed abonnieren">📡 RSS</a></footer>' _site/de/index.html

          # ── English pages (about, search) → _site/en/ ────────────────────
          # Language switcher links to the same slug in the DE folder.
          for f in content/en/pages/*.md; do
            [ -f "$f" ] || continue
            slug=$(basename "${f%.md}")
            pt=$(get_title "$f")
            {
              echo '<nav class="site-nav">'
              echo '  <a class="nav-logo" href="index.html">🪴 Digital Garden</a>'
              echo '  <span class="nav-links">'
              echo '    <a href="index.html">HOME</a>'
              echo '    <span class="nav-sep">|</span>'
              echo '    <a href="about.html">ABOUT</a>'
              echo '  </span>'
              echo '  <span class="nav-right">'
              echo "    <span class=\"nav-lang\"><a href=\"${slug}.html\">EN</a> &middot; <a href=\"../de/${slug}.html\">DE</a></span>"
              echo '    <a class="nav-search" href="search.html">&#x1F50D;</a>'
              echo '  </span>'
              echo '</nav>'
              echo "<p><a class=\"nav-back\" href=\"index.html\">&larr; Back</a></p>"
            } > _nav_page.html
            preprocess "$f" | pandoc \
              --standalone \
              --css ../style.css \
              --metadata pagetitle="$pt" \
              --metadata title="" \
              --include-before-body _nav_page.html \
              --include-after-body _graph_footer.html \
              --lua-filter .pandoc/wikilinks.lua \
              -o "_site/en/${slug}.html"

            # Inject feed discovery link + graph button
            sed -i '/<\/head>/i\  <link rel="alternate" type="application/rss+xml" title="RSS Feed" href="feed.xml">' "_site/en/${slug}.html"
            sed -i '/<span class="nav-right">/i\      <button id="graph-btn" class="graph-btn" title="Show knowledge graph">📊 Graph</button>' "_site/en/${slug}.html"
          done

          # ── German pages (about, search) → _site/de/ ───────────────────────
          for f in content/de/pages/*.md; do
            [ -f "$f" ] || continue
            slug=$(basename "${f%.md}")
            pt=$(get_title "$f")
            {
              echo '<nav class="site-nav">'
              echo '  <a class="nav-logo" href="index.html">🪴 Digital Garden</a>'
              echo '  <span class="nav-links">'
              echo '    <a href="index.html">HOME</a>'
              echo '    <span class="nav-sep">|</span>'
              echo '    <a href="about.html">ÜBER MICH</a>'
              echo '  </span>'
              echo '  <span class="nav-right">'
              echo "    <span class=\"nav-lang\"><a href=\"../en/${slug}.html\">EN</a> &middot; <a href=\"${slug}.html\">DE</a></span>"
              echo '    <a class="nav-search" href="search.html">&#x1F50D;</a>'
              echo '  </span>'
              echo '</nav>'
              echo "<p><a class=\"nav-back\" href=\"index.html\">&larr; Zurück</a></p>"
            } > _nav_page.html
            preprocess "$f" | pandoc \
              --standalone \
              --css ../style.css \
              --metadata pagetitle="$pt" \
              --metadata title="" \
              --include-before-body _nav_page.html \
              --include-after-body _graph_footer.html \
              --lua-filter .pandoc/wikilinks.lua \
              -o "_site/de/${slug}.html"

            # Inject feed discovery link + graph button
            sed -i '/<\/head>/i\  <link rel="alternate" type="application/rss+xml" title="RSS Feed" href="feed.xml">' "_site/de/${slug}.html"
            sed -i '/<span class="nav-right">/i\      <button id="graph-btn" class="graph-btn" title="Wissensgraph anzeigen">📊 Graph</button>' "_site/de/${slug}.html"
          done

          # ── English notes → _site/en/ ────────────────────────────────────
          # Each note gets: per-note nav (translation-aware lang switcher),
          # category label before <h1>, byline after <h1>, footer.
          for f in content/en/notes/*.md; do
            [ -f "$f" ] || continue
            slug=$(basename "${f%.md}")
            title=$(get_title "$f")
            category=$(get_field "$f" "category")
            author=$(get_field "$f" "author")
            note_created=$(get_field "$f" "created")
            note_modified=$(get_field "$f" "modified")
            note_version=$(get_field "$f" "version")
            written_by=$(get_field "$f" "written_by")
            translation=$(get_field "$f" "translation")

            # Language switcher: DE translation slug or fall back to DE index
            if [ -n "$translation" ]; then
              de_link="../de/${translation}.html"
            else
              de_link="../de/index.html"
            fi

            {
              echo '<nav class="site-nav">'
              echo '  <a class="nav-logo" href="index.html">🪴 Digital Garden</a>'
              echo '  <span class="nav-links">'
              echo '    <a href="index.html">HOME</a>'
              echo '    <span class="nav-sep">|</span>'
              echo '    <a href="about.html">ABOUT</a>'
              echo '  </span>'
              echo '  <span class="nav-right">'
              echo "    <span class=\"nav-lang\"><a href=\"${slug}.html\">EN</a> &middot; <a href=\"${de_link}\">DE</a></span>"
              echo '    <a class="nav-search" href="search.html">&#x1F50D;</a>'
              echo '  </span>'
              echo '</nav>'
              echo "<p><a class=\"nav-back\" href=\"index.html\">&larr; Back</a></p>"
            } > _note_nav.html

            # Footer: created · modified · version + graph button
            footer_text=""
            [ -n "$note_created" ] && footer_text="$note_created"
            [ -n "$note_modified" ] && footer_text="${footer_text:+${footer_text} &middot; modified ${note_modified}}"
            [ -n "$note_version" ] && footer_text="${footer_text:+${footer_text} &middot; }${note_version}"
            footer_text="${footer_text:+${footer_text} &middot; }<span class=\"graph-toggle\"><button id=\"graph-btn\" class=\"graph-btn\" title=\"Show knowledge graph\">📊 Graph</button></span>"
            echo "<footer class=\"note-footer\"><small>${footer_text}</small></footer>" > _note_footer.html
            echo '<div id="graph-modal" class="graph-modal"><div class="graph-container"><div id="graph-network"></div><div class="graph-legend"><p><span class="legend-dot legend-seedling">●</span> Seedling</p><p><span class="legend-dot legend-growing">●</span> Growing</p><p><span class="legend-dot legend-evergreen">●</span> Evergreen</p></div><button id="graph-close" class="graph-close" title="Close graph">✕</button></div></div>' >> _note_footer.html
            echo '<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>' >> _note_footer.html
            echo '<script src="../graph-init.js"></script>' >> _note_footer.html
            echo '<script src="../sidenotes.js"></script>' >> _note_footer.html

            preprocess "$f" | pandoc \
              --standalone \
              --wrap=none \
              --css ../style.css \
              --metadata pagetitle="$title" \
              --metadata title="" \
              --include-before-body _note_nav.html \
              --include-after-body _note_footer.html \
              --lua-filter .pandoc/wikilinks.lua \
              -o "_site/en/${slug}.html"

            # Inject category label (before <h1>) and byline (after <h1>)
            byline=""
            [ -n "$author" ] && byline="$author"
            [ -n "$note_created" ] && byline="${byline:+${byline} &middot; }${note_created}"
            [ -n "$written_by" ] && byline="${byline:+${byline} &middot; }${written_by}"
            awk -v cat="$category" -v bl="$byline" '/<h1[> ]/{if (cat != "") print "<p class=\"note-category-label\">" cat "</p>"; print; if (bl != "") print "<p class=\"note-byline\">" bl "</p>"; next}1' \
              "_site/en/${slug}.html" > _tmp.html && mv _tmp.html "_site/en/${slug}.html"
          done

          # ── German notes → _site/de/ ──────────────────────────────────────
          for f in content/de/notes/*.md; do
            [ -f "$f" ] || continue
            slug=$(basename "${f%.md}")
            title=$(get_title "$f")
            category=$(get_field "$f" "category")
            author=$(get_field "$f" "author")
            note_created=$(get_field "$f" "created")
            note_modified=$(get_field "$f" "modified")
            note_version=$(get_field "$f" "version")
            written_by=$(get_field "$f" "written_by")
            translation=$(get_field "$f" "translation")

            # Language switcher: EN translation slug or fall back to EN index
            if [ -n "$translation" ]; then
              en_link="../en/${translation}.html"
            else
              en_link="../en/index.html"
            fi

            {
              echo '<nav class="site-nav">'
              echo '  <a class="nav-logo" href="index.html">🪴 Digital Garden</a>'
              echo '  <span class="nav-links">'
              echo '    <a href="index.html">HOME</a>'
              echo '    <span class="nav-sep">|</span>'
              echo '    <a href="about.html">ÜBER MICH</a>'
              echo '  </span>'
              echo '  <span class="nav-right">'
              echo "    <span class=\"nav-lang\"><a href=\"${en_link}\">EN</a> &middot; <a href=\"${slug}.html\">DE</a></span>"
              echo '    <a class="nav-search" href="search.html">&#x1F50D;</a>'
              echo '  </span>'
              echo '</nav>'
              echo "<p><a class=\"nav-back\" href=\"index.html\">&larr; Zurück</a></p>"
            } > _note_nav.html

            footer_text=""
            [ -n "$note_created" ] && footer_text="$note_created"
            [ -n "$note_modified" ] && footer_text="${footer_text:+${footer_text} &middot; geändert ${note_modified}}"
            [ -n "$note_version" ] && footer_text="${footer_text:+${footer_text} &middot; }${note_version}"
            echo "<footer class=\"note-footer\"><small>${footer_text}</small></footer>" > _note_footer.html
            echo '<script src="../sidenotes.js"></script>' >> _note_footer.html

            preprocess "$f" | pandoc \
              --standalone \
              --wrap=none \
              --css ../style.css \
              --metadata pagetitle="$title" \
              --metadata title="" \
              --include-before-body _note_nav.html \
              --include-after-body _note_footer.html \
              --lua-filter .pandoc/wikilinks.lua \
              -o "_site/de/${slug}.html"

            byline=""
            [ -n "$author" ] && byline="$author"
            [ -n "$note_created" ] && byline="${byline:+${byline} &middot; }${note_created}"
            [ -n "$written_by" ] && byline="${byline:+${byline} &middot; }${written_by}"
            awk -v cat="$category" -v bl="$byline" '/<h1[> ]/{if (cat != "") print "<p class=\"note-category-label\">" cat "</p>"; print; if (bl != "") print "<p class=\"note-byline\">" bl "</p>"; next}1' \
              "_site/de/${slug}.html" > _tmp.html && mv _tmp.html "_site/de/${slug}.html"
          done

      # ── Graph View ───────────────────────────────────────────────────────
      - name: Generate graph visualization data
        run: |
          # Helper: Extract wikilinks from markdown file
          extract_wikilinks() {
            local file="$1"
            local source_slug=$(basename "${file%.md}")

            # Extract all [[...]] patterns, skip external links
            grep -oE '\[\[[^]]+\]\]' "$file" 2>/dev/null | \
              sed 's/\[\[//;s/\]\]//' | \
              while read link; do
                # Skip external URLs and file references
                [[ "$link" =~ ^http ]] && continue
                [[ "$link" =~ \.(pdf|docx|xlsx|png|jpg|jpeg)$ ]] && continue

                # Extract slug (remove |label and #anchor)
                target_slug="${link%%|*}"
                target_slug="${target_slug%%#*}"

                # Output source→target pair
                echo "$source_slug→$target_slug"
              done
          }

          # Generate graph for a language
          generate_graph() {
            local lang="$1"
            local graph_file="_site/${lang}/graph-data.json"

            echo "Generating graph for $lang..."

            # Step 1: Collect note metadata (exclude drafts)
            declare -A notes_meta
            while IFS= read -r f; do
              [ -f "$f" ] || continue
              slug=$(basename "${f%.md}")
              title=$(grep -m1 "^title:" "$f" | sed 's/^title:[[:space:]]*//' | tr -d '"')
              category=$(grep -m1 "^category:" "$f" | sed 's/^category:[[:space:]]*//' | tr -d '"')
              type=$(grep -m1 "^type:" "$f" | sed 's/^type:[[:space:]]*//' | tr -d '"')
              status=$(grep -m1 "^status:" "$f" | sed 's/^status:[[:space:]]*//' | tr -d '"')

              # Skip drafts
              [ "$status" = "draft" ] && continue
              [ -z "$title" ] && continue

              notes_meta["$slug"]="$title|$category|$type"
            done < <(find "content/${lang}/notes" -name "*.md" -type f)

            # Step 2: Collect all wikilinks
            all_links=""
            while IFS= read -r f; do
              [ -f "$f" ] || continue
              status=$(grep -m1 "^status:" "$f" | sed 's/^status:[[:space:]]*//' | tr -d '"')
              [ "$status" = "draft" ] && continue

              while read link; do
                source="${link%→*}"
                target="${link#*→}"

                # Only include if both nodes exist
                [[ -n "${notes_meta[$target]}" ]] && all_links="${all_links}${source}→${target}"$'\n'
              done < <(extract_wikilinks "$f")
            done < <(find "content/${lang}/notes" -name "*.md" -type f)

            # Deduplicate links
            all_links=$(echo "$all_links" | sort -u | grep -v '^$')

            # Step 3: Build JSON output
            {
              echo "{"
              echo '  "nodes": ['

              # Output nodes
              first=true
              for slug in $(for k in "${!notes_meta[@]}"; do echo "$k"; done | sort); do
                IFS='|' read -r title category type <<< "${notes_meta[$slug]}"
                [[ "$first" == true ]] || echo ","
                # Escape quotes in title
                title_esc="${title//\"/\\\"}"
                printf '    {"id": "%s", "label": "%s", "category": "%s", "type": "%s", "url": "%s.html"}' \
                  "$slug" "$title_esc" "$category" "$type" "$slug"
                first=false
              done

              echo ""
              echo '  ],'
              echo '  "links": ['

              # Output links
              first=true
              while read edge; do
                [ -z "$edge" ] && continue
                source="${edge%→*}"
                target="${edge#*→}"
                [[ "$first" == true ]] || echo ","
                printf '    {"source": "%s", "target": "%s"}' "$source" "$target"
                first=false
              done <<< "$all_links"

              echo ""
              echo "  ]"
              echo "}"
            } > "$graph_file"

            echo "✓ Generated graph: $graph_file ($(grep -o '"id"' "$graph_file" | wc -l) nodes)"
          }

          generate_graph "en"
          generate_graph "de"

      # ── RSS Feeds ────────────────────────────────────────────────────────
      - name: Generate RSS feeds
        run: |
          # Helper: Convert YYYY-MM-DD to RFC 2822 date format
          to_rfc2822() {
            local date="$1"
            date -d "$date" "+%a, %d %b %Y 00:00:00 +0000" 2>/dev/null || echo "Sat, 01 Jan 2000 00:00:00 +0000"
          }

          # Helper: Escape XML special characters
          xml_escape() {
            local text="$1"
            text="${text//&/&amp;}"
            text="${text//</&lt;}"
            text="${text//>/&gt;}"
            text="${text//\"/&quot;}"
            text="${text//\'/&apos;}"
            echo "$text"
          }

          # Helper: Extract HTML content from generated note
          get_note_content() {
            local html_file="$1"
            [ -f "$html_file" ] || return
            sed -n '/<h1/,/<footer/p' "$html_file" | head -c 3000
          }

          # Generate RSS for a language
          generate_rss() {
            local lang="$1"
            local base_url="https://profmanagement.github.io/digital-garden"
            local feed_file="_site/${lang}/feed.xml"

            echo "Generating RSS for $lang..."
            {
              echo '<?xml version="1.0" encoding="UTF-8" ?>'
              echo '<rss version="2.0">'
              echo '  <channel>'
              echo '    <title>Maik'"'"'s Digital Garden</title>'
              echo "    <link>${base_url}/${lang}/index.html</link>"
              echo '    <description>Notes on knowledge management, learning, and digital gardening</description>'
              echo "    <language>$lang</language>"

              # Sort notes by created date (newest first)
              while IFS= read -r f; do
                [ -f "$f" ] || continue
                slug=$(basename "${f%.md}")
                title=$(grep -m1 "^title:" "$f" | sed 's/^title:[[:space:]]*//' | tr -d '"')
                description=$(grep -m1 "^description:" "$f" | sed 's/^description:[[:space:]]*//' | tr -d '"')
                author=$(grep -m1 "^author:" "$f" | sed 's/^author:[[:space:]]*//' | tr -d '"')
                category=$(grep -m1 "^category:" "$f" | sed 's/^category:[[:space:]]*//' | tr -d '"')
                created=$(grep -m1 "^created:" "$f" | sed 's/^created:[[:space:]]*//' | tr -d '"')
                status=$(grep -m1 "^status:" "$f" | sed 's/^status:[[:space:]]*//' | tr -d '"')

                [ "$status" = "draft" ] && continue
                [ -z "$created" ] && continue

                html_file="_site/${lang}/${slug}.html"
                content=$(get_note_content "$html_file")
                [ -z "$content" ] && content="$(xml_escape "$description")"

                pub_date=$(to_rfc2822 "$created")

                echo '    <item>'
                echo "      <title>$(xml_escape "$title")</title>"
                echo "      <link>${base_url}/${lang}/${slug}.html</link>"
                echo "      <pubDate>$pub_date</pubDate>"
                [ -n "$author" ] && echo "      <author>$author@example.com ($author)</author>"
                [ -n "$category" ] && echo "      <category>$(xml_escape "$category")</category>"
                echo "      <description><![CDATA[$content]]></description>"
                echo "      <guid>${base_url}/${lang}/${slug}.html</guid>"
                echo '    </item>'
              done < <(
                for f in content/${lang}/notes/*.md; do
                  [ -f "$f" ] || continue
                  c=$(grep -m1 "^created:" "$f" | sed 's/^created:[[:space:]]*//;s/"//g')
                  echo "${c:-0000-00-00} $f"
                done | sort -rk1 | sed 's/^[^ ]* //'
              )

              echo '  </channel>'
              echo '</rss>'
            } > "$feed_file"

            echo "✓ RSS generated: $feed_file"
          }

          generate_rss "en"
          generate_rss "de"

      # ── Search index ─────────────────────────────────────────────────────
      - name: Build search index (Pagefind)
        run: npx pagefind --site _site

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
